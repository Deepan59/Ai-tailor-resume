version: '3.8'

services:
  backend1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend1
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - SERVER_ID=backend-server-1
      - JWT_SECRET=super_secret_jwt_key_resume_tailor_123
    networks:
      - app-network
    restart: always

  backend2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend2
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - SERVER_ID=backend-server-2
      - JWT_SECRET=super_secret_jwt_key_resume_tailor_123
    networks:
      - app-network
    restart: always

  backend3:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend3
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - SERVER_ID=backend-server-3
      - JWT_SECRET=super_secret_jwt_key_resume_tailor_123
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
