events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Round-robin distribution to 3 backend containers
        server backend1:3001;
        server backend2:3001;
        server backend3:3001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose backend identification headers to client browser DevTools
            add_header X-Upstream-Backend $upstream_addr always;
            add_header Access-Control-Expose-Headers "X-Server-Id, X-Upstream-Backend" always;
        }
    }
}
